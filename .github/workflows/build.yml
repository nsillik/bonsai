name: CI

on:
  push:
    tags: ["*"]
    branches: [ "master", "develop" ]
  # No `branches` filter: it matches the *base* branch, so a stacked PR whose
  # base is an intermediate branch (e.g. port/macos) would start no jobs at all.
  # Each PR in a stack needs its own CI run.
  pull_request:

jobs:

  build-ubuntu-22:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v3
    - name: Checkout submodules
      run: git submodule update --init --recursive
    - uses: jdx/mise-action@v3
    - name: Install Deps
      run: mise bootstrap packages apply --yes && mise install
    - name: Build
      run: ./make.sh
    - name: Test
      run: ./make.sh RunTests
    - name: Tar
      if: startsWith(github.ref, 'refs/tags/')
      run:  ./make.sh BundleRelease
    - name: Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        prerelease: true
        files: |
          Linux_x86_64_release.tar.gz
          LICENSE
          CHANGELOG.txt

  
  build-and-release-windows:
    runs-on: windows-latest
    steps:
    - name: Set up MinGW
      uses: egor-tensin/setup-mingw@v2
      with:
        platform: x64
        version: 12.2.0
    - uses: actions/checkout@v3
    - name: Checkout submodules
      run: git submodule update --init --recursive
    - name: Build
      shell: bash
      run: ./make.sh
    - name: Test
      shell: bash
      run: ./make.sh RunTests
    - name: Tar
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      run:  ./make.sh BundleRelease
    - name: Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        prerelease: true
        files: |
          Windows_x86_64_release.tar.gz
          LICENSE
          CHANGELOG.txt


  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3
    - name: Checkout submodules
      run: git submodule update --init --recursive
    # The macos-* runners are arm64 and do not ship Rosetta 2, but this build
    # cross-compiles to x86_64 (the SIMD layer is SSE/AVX-only), so the binaries
    # cannot be run -- and RunTests cannot pass -- without it.
    - name: Install Rosetta
      run: sudo softwareupdate --install-rosetta --agree-to-license
    - uses: jdx/mise-action@v3
    - name: Build
      run: ./make.sh
    - name: Test
      run: ./make.sh RunTests
